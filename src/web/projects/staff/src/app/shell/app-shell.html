<div class="flex min-h-dvh flex-col">
  <header class="flex items-center justify-between gap-3 border-b px-3 py-2">
    <a
      routerLink="/"
      class="rounded-sm font-semibold focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
    >
      HireLab
    </a>
    <div class="flex items-center gap-3">
      <hl-theme-switcher class="max-lg:hidden" />
      <hl-user-menu />
    </div>
  </header>
  <div class="flex flex-1">
    <nav aria-label="Main" class="w-52 shrink-0 border-r p-2">
      <ul class="flex flex-col gap-1">
        @for (item of navItems(); track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-accent font-medium text-accent-foreground"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              ariaCurrentWhenActive="page"
              class="flex items-center gap-2 rounded-md px-2 py-1.5 hover:bg-accent hover:text-accent-foreground focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"
            >
              <ng-icon [svg]="item.icon" size="16" aria-hidden="true" />
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
    <main class="min-w-0 flex-1 p-3">
      <router-outlet />
    </main>
  </div>
</div>
