<div class="flex min-h-dvh flex-col">
  <header class="flex items-center justify-between gap-3 border-b px-3 py-2">
    <span class="font-semibold">HireLab</span>
    <hl-theme-switcher />
  </header>
  <main class="flex flex-1 items-start justify-center px-3 pt-16">
    <section hlmCard class="w-full max-w-sm">
      <div hlmCardHeader>
        <h1 hlmCardTitle class="text-lg">Log in</h1>
        <p hlmCardDescription>Use your HireLab email and password.</p>
      </div>
      <form
        hlmCardContent
        class="flex flex-col gap-3"
        [formGroup]="form"
        (ngSubmit)="submit()"
        novalidate
      >
        @if (error(); as message) {
          <div role="alert" class="flex items-start gap-2 rounded-md border border-destructive p-2">
            <ng-icon
              name="lucideCircleAlert"
              size="16"
              class="mt-0.5 shrink-0 text-destructive"
              aria-hidden="true"
            />
            <p>{{ message }}</p>
          </div>
        }
        <div class="flex flex-col gap-1.5">
          <label hlmLabel for="login-email">Email</label>
          <input
            hlmInput
            id="login-email"
            type="email"
            autocomplete="username"
            formControlName="email"
            required
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label hlmLabel for="login-password">Password</label>
          <input
            hlmInput
            id="login-password"
            type="password"
            autocomplete="current-password"
            formControlName="password"
            required
          />
        </div>
        <button hlmBtn type="submit" class="mt-1 w-full" [disabled]="pending()">
          @if (pending()) {
            <ng-icon
              name="lucideLoaderCircle"
              class="motion-safe:animate-spin"
              aria-hidden="true"
            />
          }
          Log in
        </button>
      </form>
    </section>
  </main>
</div>
