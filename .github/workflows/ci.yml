name: CI

on:
  pull_request:
  push:
    branches: [main, 'HLB-31-*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-dotnet
        with:
          save-cache: true

      - run: dotnet tool restore

      - name: Build and test with coverage
        run: >
          dotnet test --solution HireLab.slnx
          --coverage
          --coverage-output-format cobertura
          --coverage-settings tests/coverage.config
          --results-directory artifacts/coverage

      - name: Merge coverage
        run: >
          dotnet reportgenerator
          "-reports:artifacts/coverage/**/*.cobertura.xml"
          -targetdir:artifacts/coverage/report
          "-reporttypes:MarkdownSummaryGithub;Cobertura"

      - name: Publish the coverage summary
        run: cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: artifacts/coverage/report
          retention-days: 7

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check:contrast
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v5
        with:
          name: spa
          path: src/web/dist
          retention-days: 1

  api-client:
    name: API client drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-dotnet

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: src/web

      - run: npm run api:check
        working-directory: src/web

  container-images:
    name: Container images
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-dotnet

      - uses: actions/download-artifact@v5
        with:
          name: spa
          path: src/web/dist

      - name: Build the API image
        run: >
          dotnet publish src/HireLab.Api/HireLab.Api.csproj
          --configuration Release
          --runtime linux-x64
          -t:PublishContainer
          -p:SkipSpaBuild=true

      - name: Build the migration image
        run: >
          dotnet publish src/HireLab.MigrationService/HireLab.MigrationService.csproj
          --configuration Release
          --runtime linux-x64
          -t:PublishContainer

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-dotnet

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/web/package-lock.json
            tests/e2e/package-lock.json

      - run: dotnet dev-certs https
      - run: npm ci --no-audit --no-fund
      - run: npm run install-browsers
      - run: npm test

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  infra:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-dotnet

      - name: Install Bicep
        run: |
          if ! command -v bicep > /dev/null; then
            az bicep install
            echo "BICEP=$HOME/.azure/bin/bicep" >> "$GITHUB_ENV"
          fi

      - run: eng/validate-infra.sh
