name: Set up .NET
description: Installs the SDK from global.json and restores the NuGet package cache. Only the job that restores the whole solution saves the cache.

inputs:
  save-cache:
    description: Save the NuGet package cache at the end of the job.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - if: inputs.save-cache == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'dotnet-tools.json', 'Directory.Packages.props', '**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    - if: inputs.save-cache != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'dotnet-tools.json', 'Directory.Packages.props', '**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-
